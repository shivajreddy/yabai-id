name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build universal macOS app bundle
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-universal-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x86_64 (Intel)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary with lipo
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/yabai-id \
            target/aarch64-apple-darwin/release/yabai-id \
            -output target/release-universal-yabai-id

      - name: Assemble app bundle
        run: |
          APP="yabai-id.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp target/release-universal-yabai-id "$APP/Contents/MacOS/yabai-id"
          cp assets/Info.plist                  "$APP/Contents/Info.plist"
          cp assets/AppIcon.icns                "$APP/Contents/Resources/AppIcon.icns"

      - name: Zip app bundle
        run: zip -r yabai-id.zip yabai-id.app

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: yabai-id.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
